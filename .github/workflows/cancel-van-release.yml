name: Cancel VAN release runner
on:
  push:
    branches:
      - codex/van-release-20261002-2317
    paths:
      - .github/workflows/cancel-van-release.yml
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded full-app release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code="$(curl -sS -o /tmp/cancel.json -w '%{http_code}' -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/cadenza-engineering/cadenza-release-control/actions/runs/37076898852/cancel")"
          [[ "$code" == "202" ]] || [[ "$code" == "409" ]]
